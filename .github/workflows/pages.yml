# The download page now lives on Vercel at /download (see vercel.json). This keeps the old
# GitHub Pages address alive as a redirect, so links and QR codes already handed out still
# work. It only runs when this file changes.
name: Download page redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a deploy still in flight; there is only one page to show.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write redirect page
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=https://brhp-msam.vercel.app/download" />
              <title>Download BRHP-MSAM</title>
              <script>location.replace('https://brhp-msam.vercel.app/download' + location.hash)</script>
            </head>
            <body>
              <p>This page moved. <a href="https://brhp-msam.vercel.app/download">Go to the download page</a>.</p>
            </body>
          </html>
          EOF

      # Pages must already be on with "GitHub Actions" as its source (Settings → Pages).
      # The action could switch it on itself, but only with an admin token, and
      # GITHUB_TOKEN is not one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
