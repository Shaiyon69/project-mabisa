# A push to main that changes the mobile app is the whole release process. Everything a
# phone in the field needs — a signed APK on a GitHub release — comes from that push,
# because a step that has to be remembered is a step that gets skipped.
name: Release APK

on:
  push:
    branches: [main]
    # Admin-only screens never reach the APK, so editing them ships nothing to phones.
    paths:
      - 'src/**'
      - '!src/pages/admin/**'
      - '!src/components/admin/**'
      - 'android/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
  workflow_dispatch:

# Two quick pushes must not race to publish; the later run carries the higher number.
concurrency: release-apk

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The run number only grows, so every release is newer than the last. versionName is
    # what an installed app compares against the release tag, and the tag is built from
    # it, so the two cannot disagree. versionCode starts above the 2 of earlier builds.
    env:
      VERSION_NAME: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Expressions have no arithmetic, so the offset is added in the shell.
      - run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle 8.11.1 does not support JDK 25 — the same reason the README pins JAVA_HOME
      # for a local build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Gate the release on the same checks ci.yml runs, rather than trusting that job
      # finished first. Placeholders, same as ci.yml: nothing here reaches the network.
      - run: npx tsc -b --pretty false
      - run: npm run lint
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      # Real project values, not ci.yml's placeholders: this bundle is what ships to phones.
      - run: npm run build:mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - run: npx cap sync android

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Devices read two things from the release: its .apk asset and, in the body, an
      # optional `min-version:` line. Builds below it stop syncing and must update.
      # Empty file, no line: every build keeps syncing.
      - name: Release notes
        run: |
          min=$(tr -d '[:space:]' < android/min-app-version.txt)
          {
            git log -1 --pretty=%s
            if [ -n "$min" ]; then printf '\nmin-version: %s\n' "$min"; fi
          } > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          body_path: ${{ runner.temp }}/notes.md
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
